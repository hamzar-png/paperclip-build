name: build-server
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-server.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
       
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: System deps for Rust build
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libssl-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Build all (server + Rust runner + UI)
        run: pnpm build
        env:
          PAPERCLIP_MIGRATION_PROMPT: never
          PAPERCLIP_TSC_EMIT_ONLY: "1"
      - name: Package server (self-contained)
        run: |
          pnpm --filter @paperclipai/server deploy --prod pruned
          cp -R server/dist pruned/dist
          tar -czf paperclip-server.tar.gz -C pruned .
      - uses: actions/upload-artifact@v7
        with:
          name: paperclip-server
          path: paperclip-server.tar.gz
          retention-days: 7
